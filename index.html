<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><Your Name></title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 48px 16px;
        }

        main {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .tagline {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 32px;
        }

        .card {
            display: block;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            text-decoration: none;
            color: #f1f5f9;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }

        .card h2 {
            margin: 0 0 4px;
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .card p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main>
        <h1><Your Name></h1>
        <p class="tagline"><One current line: what you are building or learning right now.></p>

        <a class="card" href="https://github.com/<your-username>">
            <h2>GitHub Profile</h2>
            <p>See who I am and what I am working on.</p>
        </a>

        <a class="card" href="https://github.com/<your-username>/<project-repo-name>">
            <h2>Repaired Project</h2>
            <p>A real project, rewritten so it explains itself.</p>
        </a>
    </main>
</body>
</html>
